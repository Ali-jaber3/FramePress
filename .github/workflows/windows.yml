name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install media tools and installer compiler
        shell: pwsh
        run: |
          choco install ffmpeg nsis -y --no-progress
          $ff = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (!$ff) { throw 'FFmpeg binary not found' }
          ./tools/Copy-FFmpeg.ps1 -BinDirectory $ff.DirectoryName
      - name: Test, publish and create installer
        shell: pwsh
        run: ./Build-Release.ps1
      - name: WPF startup and render smoke test
        shell: pwsh
        run: |
          $process = Start-Process ./artifacts/publish/FramePress.App.exe -ArgumentList "--smoke-test" -PassThru
          if (!$process.WaitForExit(60000)) {
            $process.Kill()
            throw "WPF smoke test timed out"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            foreach ($log in @("artifacts/ui-smoke-error.txt", "artifacts/wpf-bindings.log")) {
              if (Test-Path $log) {
                Write-Host "Log: $log"
                Get-Content $log
              }
            }
            throw "WPF startup or binding validation failed"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FramePress-Windows
          path: |
            artifacts/FramePress-v0.1.0-Setup.exe
            artifacts/publish/**
            artifacts/FramePress-ui-*.png
            artifacts/wpf-bindings.log
          if-no-files-found: error
